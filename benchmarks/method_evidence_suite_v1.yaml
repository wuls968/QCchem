benchmark_suite:
  name: method_evidence_suite_v1
  description: >
    Trust-first smoke benchmark for the 10-method Method Evidence v1 surface.
    The suite records numerical, resource, and artifact metrics without
    promoting exploratory methods to validated chemistry claims.
  registry_name: method_evidence_suite_v1
  tags: [benchmark, method_evidence, trust_first]
  cases:
    - name: h2_exact_baseline
      kind: run
      config: configs/h2_exact.yaml
      expected_status: validated
      tags: [baseline, h2, fast]
    - name: h2_trust_qem
      kind: run
      config: configs/exploratory/h2_trust_qem.yaml
      expected_status: validated
      tags: [trust_qem, h2, fast]
    - name: h2_trust_qem_calibrated_pec
      kind: run
      config: configs/exploratory/h2_trust_qem_calibrated_pec.yaml
      expected_status: validated
      tags: [trust_qem, pec, h2, fast]
    - name: h2_qsci_plus
      kind: run
      config: configs/exploratory/h2_qsci_plus.yaml
      expected_status: exploratory
      tags: [qsci_plus, post_correlation, h2, fast]
    - name: h2_q_sc_eom
      kind: run
      config: configs/exploratory/h2_q_sc_eom.yaml
      expected_status: validated
      tags: [q_sc_eom, h2, fast]
    - name: h2_q_embed
      kind: run
      config: configs/exploratory/h2_q_embed.yaml
      expected_status: validated
      tags: [q_embed, h2, fast]
    - name: h2_ft_qpe_planner
      kind: run
      config: configs/exploratory/h2_ft_qpe_planner.yaml
      expected_status: validated
      tags: [ft_qpe_planner, h2, fast]
    - name: h2_method_evidence_smoke
      kind: run
      config: configs/exploratory/h2_method_evidence_smoke.yaml
      expected_status: exploratory
      tags: [combined, h2, fast]
    - name: lih_active_vqe_statevector_baseline
      kind: run
      config: configs/lih_active_vqe.yaml
      overrides:
        backend.kind: statevector
        backend.shots: null
        backend.repetitions: 1
      expected_status: validated
      tags: [baseline, ideal_baseline, lih, active_space, fast]
    - name: lih_shadow_lr_e_adapt
      kind: run
      config: configs/exploratory/lih_shadow_lr_e_adapt.yaml
      expected_status: exploratory
      tags: [e_adapt, shadow_lr, lih, active_space, fast]
    - name: h2_oo_qcasscf
      kind: run
      config: configs/exploratory/h2_oo_qcasscf.yaml
      expected_status: exploratory
      tags: [oo_qcasscf, h2, fast]
    - name: pbc_h2_kq_pbc
      kind: run
      config: configs/exploratory/pbc_h2_kq_pbc.yaml
      expected_status: exploratory
      tags: [kq_pbc, pbc, fast]
