molecule:
  name: H2-oo-qcasscf
  geometry:
    - symbol: H
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [0.0, 0.0, 0.735]
  charge: 0
  multiplicity: 1
  basis: sto3g

problem:
  active_space: null

mapping:
  kind: jordan_wigner

backend:
  kind: statevector

solver:
  kind: oo_qcasscf
  experimental: true
  optimizer:
    kind: COBYLA
    maxiter: 40
  ansatz:
    kind: uccsd
    reps: 1
  initial_point: zeros
  orbital_optimization:
    active_active: false
    inactive_active: true
    active_virtual: true
    max_macro_iterations: 3
    gradient_tolerance: 1.0e-4
    rdm_source: exact

policy:
  allow_exploratory: true

exploratory:
  enabled: true
  modules: [oo_qcasscf]

benchmark:
  enabled: true
  exact_baseline_qubit_limit: 12
  absolute_error_threshold: 1.0e-3
  relative_error_threshold: 1.0e-3

run:
  seed: 47
  output_dir: artifacts/h2_oo_qcasscf
  overwrite: true
  exports:
    qcschema_json: true
