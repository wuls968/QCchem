molecule:
  name: H4-stretched-chain-qsci-plus
  geometry:
    - symbol: H
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [0.0, 0.0, 1.5]
    - symbol: H
      coords: [0.0, 0.0, 3.0]
    - symbol: H
      coords: [0.0, 0.0, 4.5]
  charge: 0
  multiplicity: 1
  basis: sto3g

problem:
  active_space: null

mapping:
  kind: jordan_wigner

backend:
  kind: statevector

solver:
  kind: exact

qsci:
  enabled: true
  sampler: local_energy_proxy
  shots: 1024
  max_determinants: 16
  min_probability: 0.0
  excited_roots: 2
  determinant_repair:
    enforce_particle_number: true
    enforce_spin_sector: true
    hamming_expansion: 2
  classical_diagonalizer:
    method: dense_exact
    max_subspace_size: 36
  residual_expansion:
    enabled: true
    scorer: external_residual_coupling
    max_iterations: 3
    batch_size: 10
    max_additional_determinants: 20
    target_residual_norm: 1.0e-8

policy:
  allow_exploratory: true

exploratory:
  enabled: true
  modules: [qsci_plus]

benchmark:
  enabled: true
  exact_baseline_qubit_limit: 12
  absolute_error_threshold: 5.0e-4
  relative_error_threshold: 5.0e-4

run:
  seed: 41
  output_dir: artifacts/h4_stretched_qsci_plus
  overwrite: true
  exports:
    qcschema_json: true
