molecule:
  name: H2-ft-qpe-planner
  geometry:
    - symbol: H
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [0.0, 0.0, 0.735]
  charge: 0
  multiplicity: 1
  basis: sto3g

problem:
  active_space: null

mapping:
  kind: jordan_wigner

backend:
  kind: statevector

solver:
  kind: exact

fault_tolerant:
  enabled: true
  method: ft_qpe_planner
  encodings:
    - double_factorization
    - symmetry_compressed_double_factorization
    - tensor_hypercontraction
  precision_hartree: 1.0e-3
  surface_code:
    physical_error_rate: 1.0e-3
    cycle_time_ns: 1000.0

policy:
  allow_exploratory: true

exploratory:
  enabled: true
  modules: [ft_qpe_planner]

benchmark:
  enabled: true
  exact_baseline_qubit_limit: 12
  absolute_error_threshold: 1.0e-8
  relative_error_threshold: 1.0e-8

run:
  seed: 43
  output_dir: artifacts/h2_ft_qpe_planner
  overwrite: true
  exports:
    qcschema_json: true
