molecule:
  name: H2-method-evidence-smoke
  geometry:
    - symbol: H
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [0.0, 0.0, 0.735]
  charge: 0
  multiplicity: 1
  basis: sto3g

problem:
  active_space: null
  measurement:
    planner: shadow_lr
    budget:
      total_shots: 256
      max_circuits: 8

mapping:
  kind: jordan_wigner

backend:
  kind: shot_estimator
  shots: 256
  seed: 47

solver:
  kind: exact

mitigation:
  symmetry_check:
    enabled: true
    strategy: postselect
    particle_number: true
  readout:
    enabled: true
    method: local_assignment
    calibration_shots: 64

qsci:
  enabled: true
  sampler: local_energy_proxy
  shots: 128
  max_determinants: 8
  determinant_repair:
    enforce_particle_number: true
    enforce_spin_sector: true
    hamming_expansion: 1
  classical_diagonalizer:
    method: dense_exact
    max_subspace_size: 32

tasks:
  excited_state:
    enabled: true
    method: q_sc_eom
    num_states: 2
    state_indices: [1]
  perturbative_correction:
    enabled: true
    method: qsci_tcc

fault_tolerant:
  enabled: true
  method: ft_qpe_planner
  encodings: [double_factorization, tensor_hypercontraction]
  precision_hartree: 1.0e-3

policy:
  allow_exploratory: true

exploratory:
  enabled: true
  modules: [trust_qem, qsci_plus, q_sc_eom, shadow_lr, ft_qpe_planner]

benchmark:
  enabled: true
  exact_baseline_qubit_limit: 12
  absolute_error_threshold: 1.0e-8
  relative_error_threshold: 1.0e-8

run:
  seed: 47
  output_dir: artifacts/h2_method_evidence_smoke
  overwrite: true
  exports:
    qcschema_json: true
