molecule:
  name: H2-qsci-plus
  geometry:
    - symbol: H
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [0.0, 0.0, 0.735]
  charge: 0
  multiplicity: 1
  basis: sto3g

problem:
  active_space: null

mapping:
  kind: jordan_wigner

backend:
  kind: statevector

solver:
  kind: exact

qsci:
  enabled: true
  sampler: local_energy_proxy
  shots: 256
  max_determinants: 8
  min_probability: 0.0
  excited_roots: 1
  determinant_repair:
    enforce_particle_number: true
    enforce_spin_sector: true
    hamming_expansion: 1
  classical_diagonalizer:
    method: dense_exact
    max_subspace_size: 32

tasks:
  perturbative_correction:
    enabled: true
    method: qsci_nevpt2

policy:
  allow_exploratory: true

exploratory:
  enabled: true
  modules: [qsci_plus]

benchmark:
  enabled: true
  exact_baseline_qubit_limit: 12
  absolute_error_threshold: 1.0e-8
  relative_error_threshold: 1.0e-8

run:
  seed: 29
  output_dir: artifacts/h2_qsci_plus
  overwrite: true
  exports:
    qcschema_json: true
