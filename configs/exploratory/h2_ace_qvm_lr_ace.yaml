molecule:
  name: H2-ACE-QVM-LR-ACE
  geometry:
    - symbol: H
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [0.0, 0.0, 0.74]
  charge: 0
  multiplicity: 1
  basis: sto3g

policy:
  name: benchmark
  allow_exploratory: true

exploratory:
  enabled: true
  modules:
    - ace_qvm
    - lr_ace
  notes:
    - ACE-QVM is an exploratory compressed-entanglement local simulator backend.
    - ACE-QVM artifacts report observable-level evidence, not hardware execution.

problem:
  compression:
    enabled: true
    method: modified_cholesky
    threshold: 1.0e-10
    max_rank: 4
    apply_to_solver: true
    execution_enabled: true
  measurement:
    strategy: ace_qvm_low_rank_lr_ace_local
    execution_mode: estimator
    grouping_policy: low_rank_factor_aware

mapping:
  kind: parity_two_qubit_reduction

backend:
  kind: ace_qvm
  seed: 1729
  ace_qvm:
    memory_budget_gib: 1
    block_qubits: 2
    max_bond_dim: 16
    truncation_eps: 1.0e-10
    max_branch_rank: 8
    cross_block_policy: auto
    routing: swap_network
    observable_mode: pauli_expectation
    debug_dense_state_qubit_limit: 10

solver:
  kind: lr_ace
  experimental: true
  optimizer:
    kind: COBYLA
    maxiter: 60
  ansatz:
    kind: lr_ace
    reps: 1
  initial_point: zeros

benchmark:
  enabled: true
  exact_baseline_qubit_limit: 12
  absolute_error_threshold: 1.6e-3
  relative_error_threshold: 1.6e-3

run:
  seed: 1729
  output_dir: artifacts/h2_ace_qvm_lr_ace
  overwrite: true
